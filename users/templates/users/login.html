<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Gutty Health System</title>
</head>

<body>

    <main>

        <h1>🔐 Iniciar sesión</h1>

        <p>
            Ingresa tus credenciales para acceder al sistema.
        </p>

        {% if error %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div>
                <label for="username">
                    Usuario:
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username }}"
                    required
                >
            </div>

            <br>

            <div>
                <label for="password">
                    Contraseña:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <br>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p>
            ¿No tienes una cuenta?

            <a href="/users/register/">
                Crear cuenta
            </a>
        </p>

    </main>

</body>

</html>
